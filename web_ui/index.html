<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Inference Dashboard</title>
  <link rel="stylesheet" href="style.css?v=20260225-2">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Inference Dashboard</h1>

    <div class="controls">
      <label class="file-label">Выберите видео
        <input id="videoInput" type="file" accept="video/*">
      </label>

      <div id="modeOptions" class="options"></div>

      <div class="buttons">
        <button id="runBtn">Запустить</button>
        <button id="clearBtn">Очистить</button>
      </div>
    </div>

    <div id="status" class="status">Готово.</div>

    <div class="cards-grid">
      <section id="summaryCard" class="card"></section>
      <section id="metaCard" class="card"></section>
    </div>

    <div class="charts-grid">
      <section class="card chart-card">
        <h3>Scores</h3>
        <canvas id="scoreChart" height="170"></canvas>
      </section>
      <section class="card chart-card">
        <h3>Statuses</h3>
        <canvas id="statusChart" height="170"></canvas>
      </section>
      <section class="card chart-card">
        <h3>Timeline</h3>
        <canvas id="timelineChart" height="170"></canvas>
      </section>
      <section class="card chart-card">
        <h3>Distribution</h3>
        <canvas id="distributionChart" height="170"></canvas>
      </section>
    </div>

    <section class="card raw-card">
      <h3>Raw JSON</h3>
      <pre id="rawJson">{}</pre>
    </section>
  </div>

  <script src="app.js?v=20260225-2"></script>
</body>
</html>
